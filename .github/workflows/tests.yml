name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The bot logic needs no Qt and no Windows API; the tests run headless. The OCR models
      # are in the repo (app/data/ocr). requirements.txt bounds the versions as constraints, so
      # the tests run within the bounds the exe ships with; the headless OpenCV takes
      # opencv-python's bound.
      - name: Install Python dependencies
        run: pip install -c requirements.txt numpy pillow onnxruntime "opencv-python-headless>=4.12,<6"
      - name: Run tests
        run: python -m unittest discover -s tests -v

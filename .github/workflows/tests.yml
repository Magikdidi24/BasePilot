name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      # The bot logic needs no Qt and no Windows API; the tests run headless.
      - name: Install Python dependencies
        run: pip install numpy opencv-python-headless pillow pytesseract tesserocr
      - name: Run tests
        env:
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata/  # tesserocr's wheel ships no tessdata
        run: python -m unittest discover -s tests -v

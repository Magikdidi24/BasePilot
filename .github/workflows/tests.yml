name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      # The bot logic needs no Qt and no Windows API; the tests run headless.
      - name: Install Python dependencies
        run: pip install numpy opencv-python-headless pillow pytesseract tesserocr
      - name: Run tests
        env:
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata/  # tesserocr's wheel ships no tessdata
        run: python -m unittest discover -s tests -v
